# Навыки PULSE — описание для раздела «Навыки» (беклог SK-1, SK-2). Сами навыки — .claude/skills/<id>/SKILL.md:
# их читает Claude; здесь — то, что видит директор. Логика (статус, правила, защита) — opsdash/skills.py.
#
# Поля:
#   id        — папка навыка в .claude/skills
#   title     — название по-человечески; area — раздел каталога (areas ниже)
#   what      — что делает, одна-две фразы; example — пример результата
#   when      — когда запускается; reads — что читает; proposes — что может предложить (только через «Да»)
#   jobs      — фоновые задания, которые работают по этому навыку (jobs.REGISTRY) — по ним последние запуски и правила
#   run       — задание и подпись кнопки «Запустить сейчас», если навык можно запустить вручную
#   requires  — без чего не работает: messages / calendar / telegram / bot / section:<архивный раздел>

areas:
  - {id: messages, title: Переписка}
  - {id: meetings, title: Встречи}
  - {id: days, title: День и неделя}
  - {id: tasks, title: Задачи и проекты}
  - {id: help, title: Ответы на вопросы}
  - {id: knowledge, title: Знания}
  - {id: learning, title: Учится у вас}

skills:
  - id: triage
    title: Разбор сообщений
    area: messages
    what: Читает новые сообщения и письма — кто ждёт вашего ответа (с черновиком), какие прозвучали обещания и поручения, что уже сделано.
    example: "«Пришлю прогноз до пятницы» в чате с Петром → ваша задача со сроком и ссылкой на сообщение."
    when: По расписанию в рабочее время и сразу, когда накопилось много новых; кнопка «Разобрать новые сейчас»
    reads: Новые сообщения и письма из подключённых чатов, ваши задачи, людей
    proposes: Закрыть задачу, связать задачу со встречей, напомнить коллеге, карточку в Kaiten
    jobs: [triage, first-finds]
    run: {job: triage, label: Разобрать сейчас}
    requires: [messages]

  - id: groups-digest
    title: Сводка рабочих групп
    area: messages
    what: Что за день решили и спрашивали в рабочих группах Telegram и где упоминали вас.
    example: "«Логистика: перенесли отгрузку на среду; Ольга спрашивает про бюджет — ждут вас»."
    when: Вечером в рабочие дни
    reads: Сообщения рабочих групп за день
    proposes: Ничего — только текст сводки
    jobs: [groups]
    requires: [telegram]

  - id: process-meeting
    title: Разбор встречи
    area: meetings
    what: После расшифровки — итоги, решения, задачи и договорённости с цитатой и временем, предложения карточек.
    example: "Планёрка на 40 минут → 6 решений и 9 задач, у каждой — кто, что и до когда, со ссылкой на [мм:сс]."
    when: Сам после каждой расшифрованной встречи
    reads: Расшифровку, прошлые встречи этой серии, задачи участников
    proposes: Карточки в Kaiten, встречи в календаре, закрыть задачи
    jobs: [process-meeting, followup]
    requires: []

  - id: meeting-brief
    title: Бриф к встрече
    area: meetings
    what: К встрече из календаря — тема, что было на прошлых встречах серии, открытые задачи участников, вопросы; для 1:1 — повестка.
    example: "«1:1 с Петром: обещал прогноз к 06.11 — не прислал; обсудить найм в Казань»."
    when: К встречам ближайших часов, в рабочее время; кнопка «Собрать бриф» у встречи
    reads: Календарь, прошлые встречи, задачи и решения
    proposes: Ничего — только текст брифа
    jobs: [briefs]
    requires: [calendar]

  - id: digest
    title: Утренний и вечерний дайджест
    area: days
    what: Встречи дня с подготовкой, кто ждёт ответа, просроченное в обе стороны, что ждёт вашего «Да», напоминания коллегам.
    example: "«Сегодня 5 встреч; ждут ответа 3; Пётр просрочил прогноз на 2 дня — напомнить?»"
    when: Утром и вечером в рабочие дни (Настройки → Расписание)
    reads: Задачи, встречи, «ждут ответа», предложения
    proposes: Напомнить коллеге
    jobs: [digest]
    run: {job: digest, label: Собрать дайджест}
    requires: []

  - id: weekly
    title: Итоги недели
    area: days
    what: Куда ушло время, что пообещали и закрыли, что просрочено, решения недели и что ждёт на следующей.
    example: "«Встречи — 21 ч, из них по складу 7 ч; закрыто 14 задач, добавилось 18 — долг растёт»."
    when: По пятницам вечером
    reads: Встречи, задачи, решения за неделю
    proposes: Ничего — только текст итогов
    jobs: [weekly]
    requires: []

  - id: projects
    title: Сборка проектов
    area: tasks
    what: Находит задачи с общим результатом, связи «одна ждёт другую» и дубли — и предлагает их.
    example: "«KPI на ноябрь: 5 задач в один проект; „Прогноз по клиентам“ записан дважды — объединить?»"
    when: По понедельникам утром и по кнопке
    reads: Ваши открытые задачи и их ход
    proposes: Проекты, связи «ждёт», объединить дубли
    jobs: [projects]
    run: {job: projects, label: Собрать проекты}
    requires: []

  - id: task-log
    title: Ход задачи
    area: tasks
    what: Собирает по задаче, что было в переписке, на встречах и в Kaiten, и записывает в ход задачи — статус без поиска по чатам.
    example: "«03.11 спросили Петра — без ответа; 05.11 Олег: подпишу до 16-го»."
    when: По кнопке «Собрать с Claude» в окне задачи; разбор сообщений дописывает ход сам
    reads: Переписку, встречи и карточки Kaiten по задаче
    proposes: Ничего — пишет только в ход задачи
    jobs: [task-log]
    requires: []

  - id: agent-brief
    title: Промт для агента
    area: tasks
    what: Готовит поручение для Claude Code или Codex по задаче — что получить, контекст с цитатой, решения, нужные файлы, опыт прошлых поручений.
    example: "«Собери сводку KPI по воронкам: файлы …, решение 29.10 — считать только по регламентам»."
    when: По кнопке «Поручить агенту» в окне задачи
    reads: Задачу, её источник, решения, документы и прошлые сессии агентов
    proposes: Ничего — только текст промта
    jobs: [agent-brief]
    requires: []

  - id: ask
    title: Ответы в боте
    area: help
    what: Отвечает на вопросы и голосовые в Telegram-боте и выполняет поручения через «Да».
    example: "«Что мне обещал Петров?» → три задачи со сроками и где это прозвучало."
    when: Когда вы пишете или наговариваете боту
    reads: Задачи, встречи, переписку, документы — что нужно для ответа
    proposes: Карточку в Kaiten, встречу, напоминание коллеге
    jobs: [ask, voice]
    requires: [bot]

  - id: chat
    title: Спросить помощника
    area: help
    what: Подробные ответы в разделе «Спросить» — по встречам, задачам, переписке и документам, разбор приложенной встречи или файла.
    example: "«Что решили по складу за месяц?» → решения по датам со ссылками на встречи."
    when: Когда вы спрашиваете
    reads: Всё, что нужно для ответа, — командами PULSE
    proposes: То же, что бот, — через «Да»
    jobs: [chat]
    requires: []

  - id: decisions
    title: Реестр решений
    area: knowledge
    what: Связывает решения со встреч и из документов с задачами, которые их исполняют, выносит «было → стало» и отмечает, чего решение ждёт.
    example: "«Средний чек апсейла — 15 тыс.» → исполняет задача «Внести в калькулятор KPI ОРК»; было 12 тыс. → стало 15 тыс."
    when: По понедельникам утром и по кнопке «Связать с задачами» в «Решениях»
    reads: Решения, задачи, разборы встреч
    proposes: Ничего — связывает решения с задачами внутри PULSE
    jobs: [decisions]
    run: {job: decisions, label: Связать с задачами}
    requires: []

  - id: anthology
    title: Решения и уроки недели
    area: knowledge
    what: По пятницам предлагает в базу знаний решения, уроки и удачи недели.
    example: "«Решение: KPI считаем только по регламентам — встреча 29.10»."
    when: По пятницам
    reads: Встречи, документы и закрытые задачи за неделю
    proposes: Записи в базу знаний
    jobs: [anthology]
    run: {job: anthology, label: Обзор недели}
    requires: ["section:kb"]

  - id: company-context
    title: О компании
    area: knowledge
    what: Раз в неделю пересобирает по вашим документам сводку «О компании», которую помощник читает перед работой.
    example: "Продукты, направления, кто есть кто, словарь терминов — одной страницей."
    when: По понедельникам утром
    reads: Документы из папок «Документов»
    proposes: Ничего — обновляет сводку контекста
    jobs: [company-context]
    run: {job: company-context, label: Обновить сейчас}
    requires: ["section:docs"]

  - id: lessons
    title: Уроки из ваших «Нет»
    area: learning
    what: Раз в неделю смотрит, что вы отклоняли и почему, и предлагает правило для навыка — оно включится только после вашего «Да».
    example: "«Связи встреч с задачами по „Дейли“ вы отклонили 5 раз — больше не предлагать?»"
    when: По пятницам и по кнопке
    reads: Отклонённые предложения с причинами, ваши правила навыков
    proposes: Правило для навыка
    jobs: [lessons]
    run: {job: lessons, label: Собрать уроки сейчас}
    requires: []
