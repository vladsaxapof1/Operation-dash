[project]
name = "opsdash"
version = "2.0.47"
description = "PULSE — личный рабочий пульт: встречи, мессенджеры, почта, календарь и Kaiten под управлением Claude"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "markdown>=3.7",
    "tzdata>=2024.1",
    "pypdf>=4",  # текст из PDF для поиска по документам
    # источники
    "telethon>=1.37",
    "segno>=1.6",  # QR-код для входа в Telegram
    "caldav>=1.4",
    "recurring-ical-events>=3",  # Google Календарь по iCal: развернуть повторяющиеся встречи
    # расшифровка и спикеры
    "faster-whisper>=1.1",
    "av>=12,<16",
    # 1.24+ собирается только под macOS 14 на Apple Silicon — держим версию с Intel-маками и macOS 13
    "onnxruntime>=1.17,<1.24",
    "sherpa-onnx>=1.10",
    # «Память»: токенизатор и векторы модели эмбеддингов (opsdash.embed); раньше приходили вместе с расшифровкой
    "tokenizers>=0.15",
    "numpy>=1.24",
]

[project.optional-dependencies]
# ускоренная расшифровка на видеоядрах Apple Silicon (macOS 14+); ставится установщиком для Mac
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# расшифровка на видеокарте NVIDIA под Windows: ctranslate2 ищет cuBLAS (CUDA 12) в системе, а в его пакете его нет.
# Ставится установщиком и обновлением, если на компьютере есть NVIDIA (updates.wants_cuda); ~630 МБ с nvrtc.
# cuDNN не нужен: ctranslate2 4.6+ собран без него. 12.9.3+ — без колеса для Windows
cuda = ["nvidia-cublas-cu12>=12.8,<12.9.3; sys_platform == 'win32'"]

[project.scripts]
ops = "opsdash.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opsdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
