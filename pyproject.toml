[project]
name = "opsdash"
version = "1.0.0"
description = "PULSE — пульт операционного директора: встречи, мессенджеры, почта, календарь и Kaiten под управлением Claude"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "markdown>=3.7",
    "tzdata>=2024.1",
    "pypdf>=4",  # текст из PDF для поиска по документам
    # источники
    "telethon>=1.37",
    "segno>=1.6",  # QR-код для входа в Telegram
    "caldav>=1.4",
    "recurring-ical-events>=3",  # Google Календарь по iCal: развернуть повторяющиеся встречи
    # расшифровка и спикеры
    "faster-whisper>=1.1",
    "av>=12,<16",
    # 1.24+ собирается только под macOS 14 на Apple Silicon — держим версию с Intel-маками и macOS 13
    "onnxruntime>=1.17,<1.24",
    "sherpa-onnx>=1.10",
]

[project.optional-dependencies]
# ускоренная расшифровка на видеоядрах Apple Silicon (macOS 14+); ставится установщиком для Mac
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
ops = "opsdash.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opsdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
